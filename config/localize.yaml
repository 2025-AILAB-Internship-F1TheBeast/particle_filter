particle_filter:
  ros__parameters:
    # seeding
    seed: 123
    # topic names
    scan_topic: '/scan'
    odometry_topic: '/odom'
    # if update is called in scan callback
    update_on_scan: False
    # range data downsampling
    angle_step: 18
    num_particles: 4000
    # ray marching
    theta_discretization: 200
    # ray marching stopping threshold
    eps: 0.01
    # range data filtering
    max_range: 30.0
    # sensor model constants
    z_short: 0.01
    z_max: 0.07
    z_rand: 0.12
    z_hit: 0.75
    sigma_hit: 8.0
    lambda_short: 0.05
    # motion model dispersion constants
    motion_dispersion_x: 0.05
    motion_dispersion_y: 0.025
    motion_dispersion_theta: 0.25

map_server:
  ros__parameters:
    # assuming map file is in particle_filter/maps
    map: 'levine_slam'
